registers:
  - name: "capability record (Table B4-1)"
    address: 0x0000
    address_end: 0x00CE
    access: "RO"
    content: "Table B4-1"
    sent: "on `CAP_REQUEST`; once per session"
    source: "0003 §2, §3; 0020 §26"
  - name: CAP_REQUEST
    address: 0x0100
    access: "W, any host"
    content: "0x00000001 requests the record; other values `BAD_VALUE`"
    sent: "answer"
    source: "0003 §2; 0020 §5"
  - name: STREAM_STATUS
    address: 0x0101
    access: "RO"
    content: "one byte per stream: [7:0] DDC0, [15:8] DUC0, [23:16] microphone, [31:24] wideband; bit 7 running, [6:0] reason (Table B8-3)"
    sent: "on change"
    source: "0004 point 7; 0020 §8"
  - name: LINK_STATUS
    address: 0x0102
    access: "RO"
    content: "[15:0] speed in Mbit/s (0 = link down); bit 16 full duplex; bit 17 non-default P2 port not honoured (latched until the next session); [31:24] session refusal reason: 0 none, 1 link below 100 Mbit/s"
    sent: "on change; B5.8"
    source: "0003 §2; 0004 point 9; 0020 §8, §13, §20"
  - name: WRITE_STATUS
    address: 0x0103
    access: "RO"
    content: "last rejected write, B8.4"
    sent: "on every rejection, to the writer"
    source: "0020 §11"
  - name: TX_ARM_TOKEN
    address: 0x0200
    access: "RO"
    content: "32-bit token; never 0, 0xFFFFFFFF or `ARM_MAGIC`; differs from the previous token, also from the last one before a reset (boot counter, B10.2 item 5)"
    sent: "at session start and on every change"
    source: "0007 Decision 1; 0020 §7; 0022 §73 item 4"
  - name: TX_ARM
    address: 0x0201
    access: "W, owner"
    content: "`token XOR ARM_MAGIC` arms; 0 disarms; any other value rejected (`BAD_TOKEN` in `TX_ARM_STATE`)"
    sent: "answer is `TX_ARM_STATE`"
    source: "0007 Decision 1; 0020 §7"
  - name: TX_ARM_STATE
    address: 0x0202
    access: "RO"
    content: "[3:0] state 0 disarmed, 1 armed, 2 inhibited (armed, but a limit inhibit is active so TX requests do not key; entered from 1 when an inhibit starts, back to 1 when it lifts, no new generation); [15:8] last reject reason of the owner; [23:16] last drop reason, 5 `RESET` after any reset until the next drop (Table A3-1 event 5); [31:24] arm generation (+1 per arm, wraps) (Table B8-3)"
    sent: "on every change"
    source: "0007 Decision 1; 0006; 0020 §8; 0022 §13, §61"
  - name: TX_STATE
    address: 0x0203
    access: "RO"
    content: "bit 0 keyed (PA actually keyed); bit 1 `WARN` active; bit 2 `REDUCE` active; bit 3 last TX request outside the TX ranges; bit 4 PA disabled by the host (General byte 58 bit [0]); bit 5 inhibit active; [11:8] TX source 0 none, 1 PTT, 2 CWX, 3 KEY, 4 ATU; [23:16] last unkey reason 0 none, 1 TX request released, 2 keyed timeout, 3 TX IQ underrun, 4 limit, 5 arm dropped, 6 retune needs RF-path change, ATU memory recall included (A3.9), 7 PA disabled by the host while keyed (B10.10), 8 keying client lost (TCI only, part C C8.2; never set by the radio over P2), 9 CW key-down longer than 1 s (B10.5a; TCI `KEYER`), 10 TX mode class changed while keyed (A3.9c); [31:24] limit id when reason 4"
    sent: "on every change (event)"
    source: "0007 Decisions 1, 2, 4; 0006; 0020 §8, §22; 0022 §1, §14, §25, §26, §28, §32"
  - name: TX_MODE_CLASS
    address: 0x0204
    access: "W, owner"
    content: "0 none declared (not writable); 1 SSB (including data modes sent as SSB), 2 CW, 3 AM, 4 FM; other values `BAD_VALUE`; power class 100 W PEP for 1, 2, 4 and 25 W carrier for 3 [G7250-MAN] (A3.4c); back to 0 at session end and at a takeover; a change to another value while keyed unkeys first (`TX_STATE` unkey reason 10, arm kept), then applies; the value in force is a no-op (A3.9c)"
    sent: "answer"
    source: "0007 Decision 4 rule 3; 0020 §9; 0022 §3, §17, §26"
  - name: KEYED_TIMEOUT
    address: 0x0205
    access: "W, owner"
    content: "ms; default 500; 100–500 accepted, other values `BAD_VALUE`; back to 500 at session end"
    sent: "answer"
    source: "0007 Decision 2; Resolved 2; 0020 §17"
  - name: WATCHDOG_STATE
    address: 0x0206
    access: "RO"
    content: "bit 0 General byte 38 bit [0] as last written, 0 while bit 2 is set; bit 1 effective state (1 while bit 2 is set); bit 2 no General packet yet (counts as enabled) (0039)"
    sent: "on change"
    source: "0007 Decision 2.3; 0020 §8"
  - name: SAFETY_STATE
    address: 0x0210
    access: "RO"
    content: "0 normal, 1 fault"
    sent: "event"
    source: "0007 Decision 5; 0020 §8"
  - name: FAULT_CODE
    address: 0x0211
    access: "RO"
    content: "first cause, Table B8-3; 0 = none"
    sent: "event"
    source: "0007 Decision 5; 0006; 0020 §8"
  - name: FAULT_FLAGS
    address: 0x0212
    access: "RO"
    content: "bit *c* set for every fault code *c* (1–31) since the last clear"
    sent: "event"
    source: "0007 Decision 5; 0020 §8"
  - name: FAULT_CLASS
    address: 0x0213
    access: "RO"
    content: "0 none, 1 host-clearable, 2 latched until reset; the highest class among the codes set in `FAULT_FLAGS` (classes per code in Table B8-3; a class-1 code escalated by A3.5 counts as class 2)"
    sent: "event"
    source: "0007 Decision 5; 0022 §5, §27"
  - name: TRIP_COUNT
    address: 0x0214
    access: "RO"
    content: "limit trips with action `UNKEY` or stronger since power-on; saturates at 0xFFFFFFFF; not cleared over P2; survives `RESTART` and resets without power loss (A3.5)"
    sent: "event"
    source: "0007 Decision 5; 0020 §8; 0022 §27"
  - name: FAULT_CLEAR
    address: 0x0215
    access: "W, owner"
    content: "write the current `FAULT_CODE`; clears all flags if every flagged code is class 1 (not escalated), its condition is gone and 10 s have passed since the latest fault entry (A3.5), else `NOT_CLEARABLE`; other values `BAD_VALUE`"
    sent: "answer"
    source: "0007 Decision 5; 0022 §5, §27"
  - name: LIMIT_STATUS
    address: 0x0220
    access: "RO"
    content: "bit *n*: limit *n* limiting (`WARN` or `REDUCE`); bit 16 + *n*: limit *n* tripped (`UNKEY` or stronger) since the last TX request; limit ids in Table B8-3"
    sent: "event"
    source: "0006; 0007; 0020 §8"
  - name: LIMIT_INHIBIT
    address: 0x0221
    access: "RO"
    content: "bit *n* (1–15): limit id *n* holds an inhibit (Table A3-2: `LIMIT_PA_TEMP` above T3; `LIMIT_SUPPLY_VOLTAGE` after an over-voltage or under-voltage `UNKEY`, until the supply has been inside the range for 2 s); bit 0 and bits 16–31 are 0; `TX_STATE` bit 5 is the OR of all bits"
    sent: "event"
    source: "0007 Decision 4; 0022 §32, §42"
  - name: LIMIT_TX_TIME
    address: 0x0230
    access: "W, owner"
    content: "maximum continuous TX time, ms; built-in 300 000; 0 = back to the persistent value, not \"no TX time\" (B8.6)"
    sent: "answer"
    source: "0007 Resolved 3; 0020 §10; 0022 §73 item 5"
  - name: LIMIT_FWD_POWER
    address: 0x0231
    access: "W, owner"
    content: "upper bound *L* on forward power, PEP, mW, all bands and classes; enforced through Table A3-3 like every other tier: on the measured PEP, or without a PEP detector on the PEP estimate from the digital crest factor of the DUC samples for every class, with the class-based mean bounds (SSB *L* × `P_ssb_mean` / 100 W, AM min(*L* / 4, 25 W), CW and FM *L*) in addition (A3.4c); also bounds the tune power (A3.4 rule 5); 0 = back to the persistent value, not \"no power\" (B8.6)"
    sent: "answer"
    source: "0007 Decision 4; 0020 §10; 0022 §17, §52, §53, §62; §73 item 5"
  - name: LIMIT_SWR
    address: 0x0232
    access: "W, owner"
    content: "1000 × SWR; checked against the persistent value of S2 (accepted if equal to or stricter than it, else `LOOSER_LIMIT`); replaces S2 when stricter, S1 in force becomes the lower of S1 and this value; 0 = back to the persistent value (B8.6)"
    sent: "answer"
    source: "0007 Decision 4; 0020 §10; 0022 §73 item 6"
  - name: LIMIT_PA_TEMP
    address: 0x0233
    access: "W, owner"
    content: "m°C; replaces T3 when stricter; 0 = back to the persistent value (B8.6)"
    sent: "answer"
    source: "0007 Decision 4; 0020 §10; 0022 §73 item 5"
  - name: TLM_PA_TEMP
    address: 0x0300
    address_end: 0x0303
    access: "RO"
    content: "m°C, signed; sensors 0–3"
    sent: "slow"
    source: "0006; HIS-11"
  - name: TLM_PA_CURRENT
    address: 0x0304
    access: "RO"
    content: "mA"
    sent: "fast"
    source: "0006; HIS-11"
  - name: TLM_SUPPLY_CURRENT
    address: 0x0305
    access: "RO"
    content: "mA (if separate from PA current)"
    sent: "fast"
    source: "0006; HIS-11"
  - name: TLM_SWR
    address: 0x0306
    access: "RO"
    content: "1000 × SWR as used by the safety core; 0 = not valid"
    sent: "fast"
    source: "0006; 0007"
  - name: SENSOR_VALID
    address: 0x0307
    access: "RO"
    content: "bit *n* as record `telemetry` bit *n*; bit 7 PA temperature sensors 1–3"
    sent: "event"
    source: "0006; HIS-11; 0020 §8"
  - name: ATU_TUNE
    address: 0x0400
    access: "W, owner"
    content: "1 starts an ATU tune cycle (A3.9b; a TX request under the arm), 0 aborts; 1 while not armed: `NOT_ARMED`; 1 while keyed by another source: `KEYED`; 1 while another key condition of A3.1a fails: `NOT_KEYABLE`; 1 before the ATU parameters are set: `NOT_CALIBRATED`; none is latched; 1 while the cycle runs or within 2 s after its end: no-op; other values `BAD_VALUE`"
    sent: "answer"
    source: "0007 Decision 6; HIS-08; 0020 §8; 0022 §14, §22, §39, §51; 0032"
  - name: ATU_STATE
    address: 0x0401
    access: "RO"
    content: "0 off or bypassed, 1 in line, 2 tuning, 3 tuned, 4 failed (the last tune did not end tuned; the ATU is back at the stored state or bypassed; stays until the next tune or an in/out change; does not block keying, A3.9b item 7), 5 unknown (latches not written because their safe values are pending hardware, P-ATU-1; 0032)"
    sent: "event"
    source: "0006; HIS-08; 0020 §8; 0022 §38"
  - name: ANT_STATE
    address: 0x0500
    access: "RO"
    content: "[7:0] connector actually selected, from 1; 0 unknown"
    sent: "event"
    source: "0006; HIS-06; 0020 §8"
code_sets:
  - set: "Arm reject reason (`TX_ARM_STATE` [15:8])"
    values:
      - value: 0
        text: "none"
      - value: 1
        name: NOT_OWNER
        text: "(reserved, not set since 0022 §13; a non-owner gets `WRITE_STATUS`)"
      - value: 2
        name: NOT_RUNNING
        text: "(not set over P2: without RUN there is no session and every write is `NOT_OWNER`, B8.5; set on TCI, part C C5.5.6 item 1)"
      - value: 3
        name: WATCHDOG_DISABLED
      - value: 4
        name: IN_FAULT
      - value: 5
        name: INHIBITED
      - value: 6
        name: PTT_ACTIVE
      - value: 7
        name: LEVEL_NOT_ACTIVE
      - value: 8
        name: MAINTENANCE
      - value: 9
        name: NO_MODE_CLASS
      - value: 10
        name: BAD_TOKEN
      - value: 11
        name: TX_NOT_IMPLEMENTED
      - value: 12
        name: NOT_CALIBRATED
        text: "(transmit parameters of Annex P not set; 0035)"
  - set: "Drop reason (`TX_ARM_STATE` [23:16]; Table A3-1)"
    values:
      - value: 0
        text: "none"
      - value: 1
        name: HOST_DISARM
      - value: 2
        name: RUN_CLEARED
      - value: 3
        name: WATCHDOG
      - value: 4
        name: TAKEOVER
      - value: 5
        name: RESET
      - value: 6
        name: FAULT
        text: "(events 6 and 13)"
      - value: 8
        name: LINK_DOWN
      - value: 9
        name: SESSION_CHANGED
      - value: 10
        name: LEVEL_CHANGE
      - value: 11
        name: MAINTENANCE
      - value: 12
        name: REDISCOVERY
      - value: 13
        name: STOP
        text: "(TCI only: `STOP` command, part C C5.5.5 row 2)"
      - value: 14
        name: HOLDER_LOST
        text: "(TCI only: arm holder's connection closed, part C C5.5.5 row 3)"
      - value: 7
        text: "unused"
      - value: 64
        text: "+ limit id `LIMIT_<name>` (event 7: action `DISARM` only; a trip with action `FAULT` gives 6 `FAULT`, the cause in `FAULT_CODE`; 0022 §41) (0022 §30)"
  - set: "Limit id (`TX_STATE` [31:24]; `LIMIT_STATUS` bit *n*; drop reason 0x40 + id)"
    values:
      - value: 1
        name: LIMIT_TX_FREQ
        text: "(TX frequency)"
      - value: 2
        name: LIMIT_SWR
        text: "(SWR; host-tunable)"
      - value: 3
        name: LIMIT_PA_TEMP
        text: "(PA temperature; host-tunable)"
      - value: 4
        name: LIMIT_FWD_POWER
        text: "(forward power; host-tunable)"
      - value: 5
        name: LIMIT_SUPPLY_VOLTAGE
        text: "(supply voltage)"
      - value: 6
        name: LIMIT_CURRENT
        text: "(supply or PA current)"
      - value: 7
        name: LIMIT_TX_TIME
        text: "(maximum continuous TX time; host-tunable)"
      - value: 8
        name: LIMIT_ATU_TIME
        text: "(ATU tune time)"
      - value: 9
        name: LIMIT_SENSOR
        text: "(sensor plausibility)"
      - value: 10
        name: LIMIT_RF_NOT_KEYED
        text: "(RF while not keyed)"
  - set: "Fault code (`FAULT_CODE`, `FAULT_FLAGS` bit) and class"
    values:
      - value: 0
        text: "none"
      - value: 2
        name: SWR_REPEATED
        text: "(3 SWR trips in 10 s), class 1"
        class: 1
      - value: 3
        name: PA_OVERTEMP
        text: "(PA temperature above T4), class 1"
        class: 1
      - value: 9
        name: SENSOR_IMPLAUSIBLE
        text: "(sensor missing, stuck or out of range), class 2"
        class: 2
      - value: 10
        name: RF_NOT_KEYED
        text: "(RF while not keyed), class 2"
        class: 2
      - value: 16
        name: TX_PATH_NOT_BLOCKED
        text: "(drop event 13), class 2"
        class: 2
      - value: 17
        name: WDT_RESET_AT_START
        text: "(processor watchdog reset seen at start-up, HIS-13), class 1"
        class: 1
      - value: 18
        name: SELFTEST_FAILED
        text: "(start-up self-test failed), class 2"
        class: 2
      - value: 19
        name: INTERNAL_ERROR
        text: "(internal consistency error), class 2"
        class: 2
  - set: "Stream reason (`STREAM_STATUS` [6:0] per byte)"
    values:
      - value: 0
        text: "none or running"
      - value: 1
        text: "not enabled by the host"
      - value: 2
        text: "not offered by this firmware"
      - value: 3
        text: "sample rate not offered"
      - value: 4
        text: "sample size not offered"
      - value: 5
        text: "data format not offered (General byte 39)"
      - value: 6
        text: "time stamp or VITA-49 requested"
      - value: 7
        text: "wideband parameters not offered"
      - value: 8
        text: "link below 100 Mbit/s"
      - value: 9
        text: "run bit clear"
      - value: 10
        text: "update in progress"
      - value: 11
        text: "VNA mode requested"
      - value: 12
        text: "EER requested"
      - value: 13
        text: "frequency encoding mismatch (General byte 37 bit [3] differs from discovery byte 21, B3.8; 0022 §73 item 12)"
      - value: 14
        text: "TX not calibrated (record `tx` bit 4 = 0, A1.12; 0039). Where several apply to one stream, the byte carries the first in this order: 10, 9, 8 (radio-wide), 1 (not enabled by the host), 13, 6, 11, 12, 5 (General-packet refusals), 2, 14 (not offered or not calibrated in this firmware), 3, 4, 7 (stream parameters) (0042)"
  - set: "Write reject reason (`WRITE_STATUS` [7:0])"
    values:
