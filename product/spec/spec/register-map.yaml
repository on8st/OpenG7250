        name: UNKNOWN_ADDRESS
      - value: 2
        name: READ_ONLY
      - value: 3
        name: NOT_OWNER
      - value: 4
        name: BAD_VALUE
      - value: 5
        name: LOOSER_LIMIT
      - value: 6
        name: BUSY
      - value: 7
        name: NOT_CLEARABLE
      - value: 8
        name: KEYED
        text: "(RF-path change or ATU tune while keyed)"
      - value: 9
        name: NOT_ARMED
      - value: 10
        name: NOT_KEYABLE
        text: "(ATU tune while another key condition of A3.1a fails, A3.9b)"
      - value: 11
        name: NOT_CALIBRATED
        text: "(ATU tune before the ATU parameters are set, A3.9b; 0032) (B8.4; 0022 §22, §51)"
